<!doctype html>
<!-- DWH 사내 테스트 설문(응답 입력). 문항은 survey-data.js 공유, 제출은 Google Sheet(Apps Script), 집계는 results.html. -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DWH 사내테스트 설문조사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<style>
  :root{
    --bg:#f5f0e6; --panel:#fdfaf3; --line:#e5d9c1; --text:#2b2118; --muted:#6d5c49;
    --accent:#9a6b16; --accent-soft:#f4e8cd; --dark:#2b2118;
    --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --display:"Do Hyeon",var(--font);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;zoom:1.2;font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;font-weight:500;line-height:1.72;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  .topnav{position:sticky;top:0;z-index:50;background:rgba(253,250,243,.92);backdrop-filter:saturate(1.3) blur(8px);border-bottom:1px solid #ddd0b6;box-shadow:0 2px 10px rgba(50,38,15,.06)}
  .topnav .in{display:flex;align-items:center;padding:0 clamp(16px,4vw,40px);height:56px;max-width:1120px;margin:0 auto}
  .brand{font-weight:800;font-size:16px;color:var(--dark);letter-spacing:-.01em}

  main{max-width:1120px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 60px}
  .hero{background:linear-gradient(135deg,#2b1e08 0%,#8a5e12 100%);color:#fff;padding:24px 30px;border-radius:16px;margin-bottom:14px}
  .hero h1{font-family:var(--display);font-size:30px;line-height:1.12;margin:0 0 6px;letter-spacing:0;font-weight:800}
  .hero p{color:#f2e9d8;margin:0;max-width:820px;font-size:14px;font-weight:500}
  [contenteditable="true"]{outline:none;border-radius:6px;transition:.14s ease}
  .hero [contenteditable="true"]:hover{background:rgba(255,255,255,.07)}
  .hero [contenteditable="true"]:focus{background:rgba(255,255,255,.12);box-shadow:0 0 0 2px rgba(224,180,92,.55)}

  .section{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:11px 0;overflow:hidden;box-shadow:0 5px 18px rgba(70,52,20,.05);scroll-margin-top:72px}
  .section-header{display:flex;align-items:center;gap:11px;padding:12px 18px 11px;border-bottom:1px solid var(--line)}
  .section-title{display:flex;gap:11px;align-items:center}
  .num{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  h2{font-family:var(--display);font-size:19px;margin:0;letter-spacing:0;font-weight:800}
  .section-body{padding:14px 18px 18px}
  .helper{font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 8px;padding-left:13px;border-left:3px solid var(--accent)}
  .helper b{color:var(--text);font-weight:800}

  .q{padding:14px 0;border-top:1px dashed var(--line)}
  .q:first-child{border-top:0;padding-top:2px}
  .qhead{display:flex;gap:9px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
  .qno{flex:none;font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums;align-self:flex-start}
  .qtext{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.5;flex:1;min-width:0}

  .choice input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .stars{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none;padding:3px 2px;border-radius:12px;outline:none;line-height:1}
  .stars:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
  .stars .srow{position:relative;display:inline-flex;line-height:1;font-size:32px}
  .stars .star{position:relative;display:inline-block;width:1.15em;height:1em;color:var(--line)}
  .stars .star::before{content:"★";display:block;width:1.15em;text-align:center}
  .stars .star .f{position:absolute;left:0;top:0;width:0;height:100%;overflow:hidden;color:var(--accent)}
  .stars .star .f::before{content:"★";display:block;width:1.15em;text-align:center}
  .stars .sval{font-family:var(--display);font-size:19px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:30px}

  .choice{display:flex;gap:8px;flex-wrap:wrap}
  .choice label{cursor:pointer;position:relative;padding:8px 17px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13.5px;font-weight:700;color:var(--muted);transition:.12s ease}
  .choice label:hover{border-color:var(--accent);color:var(--text)}
  .choice label.on{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(154,107,22,.26)}

  .field{display:flex;flex-direction:column;gap:6px;margin:4px 0}
  .fl{font-size:13.5px;font-weight:800;color:var(--text)}
  .fsub{font-size:12px;font-weight:600;color:var(--muted);margin-top:-2px}
  .tin{width:100%;font-family:var(--font);font-size:14px;font-weight:500;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px;line-height:1.65;transition:.12s ease}
  .tin::placeholder{color:#b7a78c}
  .tin:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .tin:disabled{background:#f1ece0;color:#b7a78c;cursor:not-allowed;box-shadow:none}
  textarea.tin{min-height:76px;resize:vertical}
  .qbody{margin-top:2px}
  .repro{margin-top:9px}
  .repro .fl{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}

  .needfix{border-radius:12px;box-shadow:0 0 0 3px var(--accent),0 0 0 9px var(--accent-soft)!important;animation:nfPulse .85s ease-out 1}
  @keyframes nfPulse{from{box-shadow:0 0 0 3px var(--accent),0 0 0 0 rgba(154,107,22,.4)}to{box-shadow:0 0 0 3px var(--accent),0 0 0 9px var(--accent-soft)}}
  @media (prefers-reduced-motion:reduce){.needfix{animation:none}}

  .btnrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:14px 0 2px}
  .btn{cursor:pointer;font:800 14px/1 var(--font);border-radius:10px;padding:13px 22px;border:1px solid var(--accent);background:var(--accent);color:#fff;transition:.12s ease;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(1.06)}
  .btn.wait{background:#e7dcc3;border-color:#e0d3b6;color:#9a8a70;box-shadow:none;filter:none}
  .btn.wait:hover{filter:none}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:80;background:#2b2118;color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:11px;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.22s ease}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:720px){
    .topnav .in{padding:0 14px}
    main{padding:16px 14px 50px}
    .hero{padding:20px 18px}.hero h1{font-size:25px}
    .toast{left:10px;right:10px;transform:translateY(12px);width:auto}
    .toast.show{transform:translateY(0)}
  }
  @media print{
    .topnav,.toast{display:none!important}
    main{width:100%;padding:0;margin:0;max-width:none}
    body{background:#fff;font-size:11pt;zoom:1}
    .choice label.on,.stars .star .f{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .section,.hero{break-inside:avoid;box-shadow:none}
    .hero{background:#2b2118!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
  <header class="topnav">
    <div class="in"><div class="brand">DWH 사내테스트 설문조사</div></div>
  </header>

  <main>
    <section class="hero" id="doc-top">
      <h1 contenteditable="true" data-k="title">DWH 사내테스트 설문조사</h1>
      <p contenteditable="true" data-k="sub">Desktop Wallet Heroes 사내 플레이 테스트 피드백입니다. 모든 문항에 응답하면 제출 버튼이 활성화됩니다.</p>
    </section>
    <form id="survey" autocomplete="off"></form>
  </main>

<div class="toast" id="toast"></div>

<script src="survey-data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.DWH, SKEY = D.SKEY, SCALE = D.SCALE, SECTIONS = D.SECTIONS;
  var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
  var EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  var form = document.getElementById("survey");
  var html = "";
  SECTIONS.forEach(function(sec){
    html += '<section class="section" id="'+sec.id+'"><div class="section-header"><div class="section-title"><span class="num">'+esc(sec.no)+'</span><h2>'+esc(sec.title)+'</h2></div></div><div class="section-body">';
    if(sec.bodyHtml) html += sec.bodyHtml;

    if(sec.fields){
      sec.fields.forEach(function(f){
        html += '<div class="field"><span class="fl">'+esc(f.label)+'</span>';
        if(f.note) html += '<span class="fsub">'+esc(f.note)+'</span>';
        if(f.type==="choice"){
          html += '<div class="choice" data-name="'+f.name+'">';
          f.options.forEach(function(op){ html += '<label><input type="radio" name="'+f.name+'" value="'+esc(op)+'"><span>'+esc(op)+'</span></label>'; });
          html += '</div>';
        } else {
          var itype = f.type==="email" ? "email" : "text";
          html += '<input class="tin" type="'+itype+'" name="'+f.name+'" placeholder="'+esc(f.ph||"")+'"'+(f.type==="email"?' inputmode="email" autocapitalize="off" spellcheck="false"':'')+'>';
        }
        html += '</div>';
      });
    }

    if(sec.questions){
      sec.questions.forEach(function(q){
        var nm = "q"+q.no;
        html += '<div class="q"><div class="qhead"><span class="qno">'+esc(q.no)+'</span><span class="qtext">'+esc(q.t)+'</span></div><div class="qbody">';
        if(q.type==="scale5"){
          html += '<div class="stars" data-name="'+nm+'" tabindex="0" role="slider" aria-label="별점 0.5~5점" title="리뷰처럼 좌우로 움직여 0.5~5점(반 별 가능)"><span class="srow">';
          for(var i=1;i<=5;i++){ html += '<span class="star"><span class="f"></span></span>'; }
          html += '</span><span class="sval"></span><input type="hidden" name="'+nm+'" value="5"></div>';
        } else if(q.type==="choice"){
          html += '<div class="choice" data-name="'+nm+'">';
          q.options.forEach(function(op){ html += '<label><input type="radio" name="'+nm+'" value="'+esc(op)+'"><span>'+esc(op)+'</span></label>'; });
          html += '</div>';
        } else if(q.type==="bug"){
          html += '<div class="choice" data-name="'+nm+'">';
          ["유","무"].forEach(function(op){ html += '<label><input type="radio" name="'+nm+'" value="'+op+'"><span>'+op+'</span></label>'; });
          html += '</div><div class="repro"><span class="fl">상황 · 재현 경로</span><textarea class="tin" name="'+nm+'r" placeholder="‘유’ 선택 시 입력: 빌드 버전 · 조작 순서 · 발생 시점" disabled></textarea></div>';
        } else {
          html += '<textarea class="tin" name="'+nm+'" placeholder="자유롭게 적어 주세요"></textarea>';
        }
        html += '</div></div>';
      });
    }

    if(sec.custom==="submit"){
      html += '<div class="btnrow"><button type="button" class="btn wait" id="btnSubmit">제출하기</button></div>';
    }
    html += '</div></section>';
  });
  form.innerHTML = html;

  // 별점(0.5 단위) 위젯: 리뷰처럼 반 별 선택
  function starValFromX(srow, clientX){
    var rect = srow.getBoundingClientRect(), frac = (clientX-rect.left)/rect.width;
    if(frac<0) frac=0; if(frac>1) frac=1;
    var v = Math.ceil(frac*10)/2;
    return v<0.5?0.5:(v>5?5:v);
  }
  function paintStars(c, v){
    var st = c.querySelectorAll('.star');
    for(var i=0;i<st.length;i++){ var f=st[i].querySelector('.f'), n=i+1; f.style.width=(v>=n?100:(v>=n-0.5?50:0))+"%"; }
    var sv = c.querySelector('.sval'); if(sv) sv.textContent = v ? (String(v)+"점") : "";
  }
  function syncStars(){ form.querySelectorAll('.stars').forEach(function(c){ paintStars(c, parseFloat(c.querySelector('input').value)||0); }); }
  form.querySelectorAll('.stars').forEach(function(c){
    var srow=c.querySelector('.srow'), inp=c.querySelector('input');
    function commit(v){ inp.value = v?String(v):""; paintStars(c, v); save(); refresh(); }
    srow.addEventListener('mousemove', function(e){ paintStars(c, starValFromX(srow, e.clientX)); });
    srow.addEventListener('mouseleave', function(){ paintStars(c, parseFloat(inp.value)||0); });
    srow.addEventListener('click', function(e){ commit(starValFromX(srow, e.clientX)); });
    c.addEventListener('keydown', function(e){
      var v=parseFloat(inp.value)||0, nv=null;
      if(e.key==="ArrowRight"||e.key==="ArrowUp") nv=Math.min(5, v+0.5);
      else if(e.key==="ArrowLeft"||e.key==="ArrowDown") nv=Math.max(0.5,(v||0.5)-0.5);
      else return;
      e.preventDefault(); commit(nv);
    });
  });

  var F = D.flatten(), COLS = F.COLS;

  // 완료 판정에 쓸 항목 순서(화면 순서). repro 는 해당 버그가 '유'일 때만 필수.
  var order = [], bugRepros = [];
  F.Q.forEach(function(q){
    if(q.type==="scale5"||q.type==="choice") order.push({ name:q.name, kind:"radio" });
    else if(q.type==="email") order.push({ name:q.name, kind:"text", email:true });
    else if(q.type==="text") order.push({ name:q.name, kind:"text" });
    else if(q.type==="textarea") order.push({ name:q.name, kind:"text" });
    else if(q.type==="bug"){ order.push({ name:q.name, kind:"radio" }); order.push({ name:q.name+"r", kind:"repro", bug:q.name }); bugRepros.push(q.name); }
  });

  function getVal(name){
    var r = form.querySelector('input[type="radio"][name="'+CSS.escape(name)+'"]:checked');
    if(r) return r.value;
    var el = form.querySelector('[name="'+CSS.escape(name)+'"]');
    return el ? (el.value||"").trim() : "";
  }
  function gather(){ var o = {}; COLS.forEach(function(c){ var v = getVal(c.name); if(v) o[c.name] = v; }); return o; }

  function itemDone(it){
    if(it.kind==="radio") return !!getVal(it.name);
    if(it.kind==="repro"){ return getVal(it.bug)==="유" ? !!getVal(it.name) : true; }
    var v = getVal(it.name);
    if(!v) return false;
    if(it.email) return EMAIL.test(v);
    return true;
  }
  function firstIncomplete(){ for(var i=0;i<order.length;i++){ if(!itemDone(order[i])) return order[i]; } return null; }
  function isComplete(){ return firstIncomplete()===null; }

  function syncChips(){
    form.querySelectorAll('.choice label').forEach(function(lb){
      var inp = lb.querySelector('input'); if(inp) lb.classList.toggle('on', inp.checked);
    });
  }
  // 버그 '유'면 재현 주관식 활성화, '무'(또는 미선택)면 비활성화·초기화
  function syncRepro(){
    bugRepros.forEach(function(nm){
      var ta = form.querySelector('textarea[name="'+CSS.escape(nm+"r")+'"]'); if(!ta) return;
      var on = getVal(nm)==="유";
      ta.disabled = !on;
      if(!on && ta.value) ta.value = "";
    });
  }
  function updateSubmit(){ btnSubmit.classList.toggle("wait", !isComplete()); }

  var btnSubmit = document.getElementById("btnSubmit");
  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200); }

  function save(){ try{ localStorage.setItem(SKEY+"answers", JSON.stringify(gather())); }catch(e){} }
  function restore(){
    var data = {}; try{ data = JSON.parse(localStorage.getItem(SKEY+"answers")||"{}")||{}; }catch(e){}
    Object.keys(data).forEach(function(name){
      var val = data[name];
      var radios = form.querySelectorAll('input[type="radio"][name="'+CSS.escape(name)+'"]');
      if(radios.length){ radios.forEach(function(r){ if(r.value===val) r.checked = true; }); }
      else { var el = form.querySelector('[name="'+CSS.escape(name)+'"]'); if(el) el.value = val; }
    });
  }
  function refresh(){ syncRepro(); syncChips(); syncStars(); updateSubmit(); }
  restore(); refresh();
  form.addEventListener("input", function(){ save(); refresh(); });
  form.addEventListener("change", function(){ save(); refresh(); });

  function jumpTo(it){
    if(!it) return;
    var el = form.querySelector('[name="'+CSS.escape(it.name)+'"]');
    if(!el) return;
    var box = el.closest('.q, .field') || el.closest('.section') || el;
    box.scrollIntoView({ behavior:"smooth", block:"center" });
    box.classList.add("needfix"); setTimeout(function(){ box.classList.remove("needfix"); }, 1000);
    if(el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && el.type!=="radio" && el.type!=="hidden")){ try{ el.focus({ preventScroll:true }); }catch(e){} }
  }

  btnSubmit.addEventListener("click", async function(){
    var it = firstIncomplete();
    if(it){ jumpTo(it); toast("아직 응답하지 않은 문항이 있습니다"); return; }
    var ep = D.resolveEndpoint();
    if(!ep){ toast("제출 대상(Apps Script URL)이 설정되지 않았습니다"); return; }
    var ans = gather();
    var btn = this, label = btn.textContent; btn.disabled = true; btn.textContent = "제출 중…";
    try{
      await fetch(ep, { method:"POST", mode:"no-cors", body: JSON.stringify(D.buildSubmission(ans)) });
      try{ localStorage.removeItem(SKEY+"answers"); }catch(e){}
      form.querySelectorAll('input[type="radio"]').forEach(function(r){ r.checked=false; });
      form.querySelectorAll('.tin').forEach(function(t){ t.value=""; });
      refresh();
      window.scrollTo({ top:0, behavior:"smooth" });
      toast("제출 완료 — 참여해 주셔서 감사합니다");
    }catch(err){
      toast("제출 실패: 네트워크를 확인하고 다시 시도하세요");
    }finally{
      btn.disabled = false; btn.textContent = label;
    }
  });

  try{
    document.querySelectorAll('[contenteditable="true"][data-k]').forEach(function(el){
      var key = SKEY+el.getAttribute("data-k"); var saved = localStorage.getItem(key);
      if(saved!==null) el.innerHTML = saved;
      el.addEventListener("input", function(){ try{ localStorage.setItem(key, el.innerHTML); }catch(e){} });
    });
  }catch(e){}
})();
</script>
</body>
</html>
